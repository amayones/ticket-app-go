version: '3'

# Semua logika ada di scripts/*.sh (universal: bash/zsh/Git Bash).
# Taskfile ini hanya alias tipis agar `task x` == `./scripts/x.sh`.
vars:
  FRONTEND_DIR: frontend

tasks:
  default:
    desc: Build frontend + backend (single binary)
    cmds:
      - task: build

  install:
    desc: Install frontend dependencies (reproducible)
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - npm ci --no-audit --no-fund
    sources:
      - package-lock.json
      - package.json

  build-frontend:
    desc: Build React frontend into frontend/dist
    cmds:
      - bash ./scripts/build-frontend.sh
    sources:
      - src/**/*.*
      - index.html
      - vite.config.js
      - package.json
    generates:
      - dist/index.html

  build-backend:
    desc: Vet + build backend binary with optimizations
    cmds:
      - bash ./scripts/build-backend.sh
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
      - frontend/dist/index.html

  build:
    desc: Full single-binary build (frontend + backend)
    cmds:
      - task: build-frontend
      - task: build-backend

  run:
    desc: Build and run in foreground
    cmds:
      - bash ./scripts/run.sh

  tray:
    desc: Build and run hidden in background (--hide)
    cmds:
      - bash ./scripts/run.sh --hide

  stop:
    desc: Stop hidden app gracefully via PID file
    cmds:
      - bash ./scripts/stop.sh

  watch:
    desc: Auto rebuild on change (prod-like loop)
    cmds:
      - bash ./scripts/watch.sh

  dev:
    desc: Daily development in ONE terminal (alias of start)
    cmds:
      - bash ./scripts/dev.sh

  start:
    desc: Run backend + Vite HMR in ONE terminal (Ctrl+C stops both)
    cmds:
      - bash ./scripts/start.sh

  migrate:
    desc: Apply scripts/migrate*.sql in order to SQL Server (requires sqlcmd)
    dotenv: ['.env']
    cmds:
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -b -i scripts/migrate.sql
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -b -i scripts/migrate2_rbac.sql
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -b -i scripts/migrate3_mcontrol.sql
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -b -i scripts/migrate4_ticket_roles.sql
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -b -i scripts/migrate5_dashboard.sql
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -b -i scripts/migrate6_discovery.sql
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -b -i scripts/migrate7_discovery_menus.sql
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -b -i scripts/migrate8_discovery_unmenu.sql
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -b -i scripts/migrate9_event.sql
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -b -i scripts/migrate10_event_menus.sql
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -b -i scripts/migrate11_fold_create_event.sql
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -b -i scripts/migrate12_ticketing.sql
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -b -i scripts/migrate13_ticketing_menus.sql

  migrate-postgres:
    desc: Apply scripts/schema.postgres.sql to PostgreSQL (requires psql)
    dotenv: ['.env']
    cmds:
      - psql -h {{.DB_HOST}} -p {{.DB_PORT}} -U {{.DB_USERNAME}} -d {{.DB_DATABASE}} -v ON_ERROR_STOP=1 -f scripts/schema.postgres.sql

  migrate-sqlite:
    desc: Apply scripts/schema.sqlite.sql to the SQLite file in DB_DATABASE (requires sqlite3)
    dotenv: ['.env']
    cmds:
      - bash -c 'mkdir -p "$(dirname {{.DB_DATABASE}})" && sqlite3 {{.DB_DATABASE}} < scripts/schema.sqlite.sql'

  seed-dashboard:
    desc: Seed dashboard demo data (T_* tables only, requires migrate4+migrate5)
    dotenv: ['.env']
    cmds:
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -b -i scripts/seed-dashboard.sql

  seed-discovery:
    desc: Seed discovery demo data (T_* tables only, requires migrate6)
    dotenv: ['.env']
    cmds:
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -b -i scripts/seed-discovery.sql

  seed-event:
    desc: Seed event demo data (T_* tables only, requires migrate9)
    dotenv: ['.env']
    cmds:
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -b -i scripts/seed-event.sql

  seed-ticketing:
    desc: Seed ticketing demo data (T_* tables only, requires migrate12)
    dotenv: ['.env']
    cmds:
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -b -i scripts/seed-ticketing.sql

  test:
    desc: Go vet + race tests
    cmds:
      - go vet ./...
      - go test -race ./...

  lint-frontend:
    desc: Lint frontend
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - npm run lint

  clean:
    desc: Remove binaries and frontend build output (cross-platform)
    cmds:
      - bash ./scripts/clean.sh
