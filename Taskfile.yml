version: '3'

# Semua logika ada di scripts/*.sh (universal: bash/zsh/Git Bash).
# Taskfile ini hanya alias tipis agar `task x` == `./scripts/x.sh`.
vars:
  FRONTEND_DIR: frontend

tasks:
  default:
    desc: Build frontend + backend (single binary)
    cmds:
      - task: build

  install:
    desc: Install frontend dependencies (reproducible)
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - npm ci --no-audit --no-fund
    sources:
      - package-lock.json
      - package.json

  build-frontend:
    desc: Build React frontend into frontend/dist
    cmds:
      - bash ./scripts/build-frontend.sh
    sources:
      - src/**/*.*
      - index.html
      - vite.config.js
      - package.json
    generates:
      - dist/index.html

  build-backend:
    desc: Vet + build backend binary with optimizations
    cmds:
      - bash ./scripts/build-backend.sh
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
      - frontend/dist/index.html

  build:
    desc: Full single-binary build (frontend + backend)
    cmds:
      - task: build-frontend
      - task: build-backend

  run:
    desc: Build and run in foreground
    cmds:
      - bash ./scripts/run.sh

  tray:
    desc: Build and run hidden in background (--hide)
    cmds:
      - bash ./scripts/run.sh --hide

  stop:
    desc: Stop hidden app gracefully via PID file
    cmds:
      - bash ./scripts/stop.sh

  watch:
    desc: Auto rebuild on change (prod-like loop)
    cmds:
      - bash ./scripts/watch.sh

  dev:
    desc: Daily development in ONE terminal (alias of start)
    cmds:
      - bash ./scripts/dev.sh

  start:
    desc: Run backend + Vite HMR in ONE terminal (Ctrl+C stops both)
    cmds:
      - bash ./scripts/start.sh

  migrate:
    desc: Apply scripts/migrate*.sql in order to SQL Server (requires sqlcmd)
    dotenv: ['.env']
    cmds:
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -i scripts/migrate.sql
      - sqlcmd -S {{.DB_HOST}},{{.DB_PORT}} -U {{.DB_USERNAME}} -P {{.DB_PASSWORD}} -d {{.DB_DATABASE}} -C -i scripts/migrate2_rbac.sql

  test:
    desc: Go vet + race tests
    cmds:
      - go vet ./...
      - go test -race ./...

  lint-frontend:
    desc: Lint frontend
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - npm run lint

  clean:
    desc: Remove binaries and frontend build output (cross-platform)
    cmds:
      - bash ./scripts/clean.sh
