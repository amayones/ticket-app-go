name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go vet ./...
      - run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Versi Node mengikuti .nvmrc di root (sumber tunggal).
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  single-binary:
    runs-on: windows-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          # Versi Node mengikuti .nvmrc di root (sumber tunggal).
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go vet ./...
      - run: go build -trimpath -ldflags "-s -w" -o app.exe .
      - run: go build -trimpath -ldflags "-s -w" -o stop.exe ./cmd/stop
